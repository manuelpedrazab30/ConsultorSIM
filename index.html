:root{--bg:#f7f7f5;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#e3e3de;--ac:#2563eb;--ok:#15803d;--ko:#b91c1c;--okbg:#e8f5ec;--kobg:#fbeaea}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--tx:#ececE8;--mu:#9b9b94;--bd:#33332f;--ac:#6ea0ff;--ok:#4ade80;--ko:#f87171;--okbg:#14301d;--kobg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0}h2{font-size:18px;margin:28px 0 10px}h3{font-size:16px;margin:0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:default}
input[type=number],input[type=text],select{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);max-width:100%}
input[type=range]{width:100%}
code{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.ko{background:var(--kobg);border:1px solid var(--ko)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:left}td.n,th.n{text-align:right}
.opt{display:block;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--ac)}
.eq{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin:8px 0}.eq span{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 10px}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0;font-size:14px}.live div{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:1px 9px;color:var(--mu)}
svg text{fill:var(--mu);font-size:11px}

.hud{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;background:#1f2937;color:#e5e7eb;border-radius:10px;padding:8px 14px;font-size:14px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.paper{background:#fbf7ec;color:#222;border:1px solid #d9d0b8;border-radius:6px;padding:16px;box-shadow:2px 3px 0 rgba(0,0,0,.12)}
.paper .mu{color:#7a7561}.paper td,.paper th{border-color:#e4dcc3}.paper textarea{width:100%;margin-top:10px;font:inherit;font-size:14px;border:1px dashed #cbbf9c;background:transparent;color:#222;border-radius:6px;padding:6px}
.big{font-size:30px;font-weight:700;margin:6px 0}
.appr{background:#15803d}.rej{background:#b91c1c}.appr,.rej{font-size:17px;padding:12px 26px;letter-spacing:1px}
.stamp{display:inline-block;border:4px solid;padding:2px 12px;font-weight:800;letter-spacing:2px;transform:rotate(-4deg);font-size:20px}.stamp.ok{color:var(--ok)}.stamp.ko{color:var(--ko)}
.fl.sel td{background:#fde68a;color:#222}.fl.bad td{background:#fecaca;color:#222}.picking .fl{cursor:pointer}.picking .fl:hover td{background:#fef3c7;color:#222}
.rules details{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:14px}.rules summary{cursor:pointer;font-weight:600}
.new{font-size:11px;background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;margin-left:6px}

/* ===== PIXEL THEME ===== */
:root{--bg:#23221f;--card:#3a3731;--tx:#e8e2cc;--mu:#a79f85;--bd:#14130f;--ac:#d9a441;--ok:#7bc26a;--ko:#e0584a;--okbg:#27381f;--kobg:#3d1f1b}
body{font-family:'VT323','Courier New',monospace;font-size:21px;line-height:1.25}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 3px)}
h1,h2,h3,button,.stamp,.bigstamp,.hud,.plate,.tag,.new,th,.big{font-family:'Press Start 2P','Courier New',monospace}
h1{font-size:17px;line-height:1.5}h2{font-size:13px;line-height:1.5;color:var(--ac)}h3{font-size:12px;line-height:1.5}
.mu{font-size:18px}
.card{border:4px solid #14130f;border-radius:0;box-shadow:4px 4px 0 #0b0b09}
button{font-size:11px;line-height:1.5;border:4px solid #14130f;border-radius:0;background:var(--ac);color:#14130f;padding:8px 14px;box-shadow:0 4px 0 #14130f;margin-bottom:4px}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #14130f}
button.sec{background:#55503f;color:var(--tx)}
button small{font-size:9px}
.appr{background:#4c7a3a;color:#fff}.rej{background:#a8352b;color:#fff}.appr,.rej{font-size:13px;padding:12px 22px}
input[type=number],input[type=text],select{border:3px solid #14130f;border-radius:0;background:#efe9d0;color:#2a2622;font-family:inherit;font-size:20px}
code{border-radius:0;background:#2b2924;border:2px solid #14130f}
.bar{height:12px;border:3px solid #14130f;border-radius:0;background:#2b2924}.bar i{background:var(--ok)}
.fb,.live div,.eq span,.tag,.opt,.stamp{border-radius:0}
.opt{border:3px solid #14130f;background:#2f2c27}
.hud{background:#14130f;color:var(--ac);border:4px solid #000;border-radius:0;font-size:10px;line-height:1.6;padding:10px 12px;align-items:center}
.paper{background-color:#d9d2b6;color:#2a2622;border:4px solid #14130f;border-radius:0;box-shadow:4px 4px 0 #0b0b09;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(0,0,0,.05) 23px 24px)}
.paper .mu{color:#6b6450}.paper td,.paper th{border-color:#b9b194}.paper textarea{border:2px dashed #8f876c;border-radius:0;font-family:inherit;font-size:19px}
.big{font-size:20px;line-height:1.4}
.desktop{background-color:#4a3f31;border:4px solid #14130f;padding:12px;margin-bottom:12px;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.10) 0 3px,transparent 3px 36px);box-shadow:inset 0 0 0 4px #5b4d3a}
.rules details{background:#5b4a35;border:3px solid #14130f;border-radius:0;color:#efe6c8}
.rules h3{color:#efe6c8}
.new{border-radius:0;background:var(--ko);color:#fff;font-size:8px;padding:2px 5px}
.booth{position:relative;height:190px;border:4px solid #14130f;margin-bottom:12px;overflow:hidden;background:linear-gradient(#34423d 0 72%,#2c3833 72% 100%)}
.booth::before{content:"";position:absolute;left:24px;top:22px;width:56px;height:70px;background:#d9d2b6;border:4px solid #14130f;box-shadow:inset 0 0 0 4px #b9b194}
.booth::after{content:"";position:absolute;right:28px;top:26px;width:70px;height:46px;background:#1f2a35;border:4px solid #5b4a35;box-shadow:inset -14px 0 0 #2d3d4b}
.counter{position:absolute;left:0;right:0;bottom:0;height:34px;background:#5b4a35;border-top:4px solid #14130f;z-index:2;display:flex;align-items:center;justify-content:center}
.plate{background:#14130f;color:var(--ac);font-size:9px;padding:6px 10px}
canvas.pt{image-rendering:crisp-edges;image-rendering:pixelated;width:128px;height:160px}
.booth canvas.pt{position:absolute;left:50%;bottom:30px;margin-left:-64px;animation:rise .5s steps(6) both}
.booth canvas.pt.leave{animation:leave .35s steps(5) forwards}
@keyframes rise{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{to{transform:translateX(160px);opacity:0}}
.paper canvas.boss{float:right;width:96px;height:120px;margin:0 0 8px 12px;border:4px solid #14130f;background:#34423d}
.bigstamp{position:absolute;right:12px;top:10px;padding:6px 14px;border:5px solid;font-size:18px;transform:rotate(-8deg);animation:slam .3s steps(5) both;background:rgba(217,210,182,.6);z-index:3}
.bigstamp.a{color:#2f6a24}.bigstamp.r{color:#a8352b}
@keyframes slam{0%{transform:scale(3.2) rotate(-14deg);opacity:0}70%{transform:scale(.92) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
table{font-size:20px}

{subj:E,type:'choice',concept:'Shutdown condition',ref:'Acemoglu Ch.6',answer:2,
 question:'When should a perfectly competitive firm shut down in the short run?',
 options:['When total revenue is less than total fixed cost.','When price is less than average total cost.','When total revenue is less than total variable cost (price < AVC).','When marginal revenue exceeds marginal cost.'],
 explain:'If it cannot cover variable costs, producing makes losses larger than the fixed cost it loses by shutting down.'},
{subj:E,type:'numeric',concept:'Externalities: social optimum',ref:'Acemoglu Ch.9',answer:15,
 question:'A factory\'s private marginal cost is MC = 10 + Q and it imposes a constant marginal external cost of 10. Demand (marginal social benefit) is P = 50 − Q. What is the socially optimal quantity?',
 explain:'MSC = 20 + Q. Setting 20 + Q = 50 − Q gives Q = 15 (the private optimum would be 20).'},
{subj:E,type:'numeric',unit:'$',concept:'Coase theorem',ref:'Acemoglu Ch.9',answer:400,
 question:'A factory causes $1,000 of pollution damage to a homeowner. A filter costing $400 eliminates it. With zero transaction costs and the homeowner holding the property right, what is the most the factory would pay for the right to pollute?',
 explain:'The factory will never pay more than its cost of fixing the problem ($400); installing the filter is efficient because 400 < 1,000.'},
{subj:E,type:'choice',concept:'Externalities: policy',ref:'Acemoglu Ch.9',answer:1,
 question:'Which tool is most appropriate to correct a positive externality such as vaccinations?',
 options:['Pigouvian tax','Pigouvian subsidy','Price ceiling','Production quota'],
 explain:'A subsidy rewards the activity so the private benefit matches the social benefit.'},
{subj:E,type:'numeric',unit:'$',concept:'Public goods',ref:'Acemoglu Ch.9',answer:100,
 question:'Two neighbors consider a security camera costing $300. Each values it at $200 and the benefit is non-excludable. What is the net social benefit of installing it?',
 explain:'Social benefit 200 + 200 = 400, minus cost 300 = +100, so it is efficient. But each neighbor alone gets 200 < 300, so private provision fails: the free-rider problem.'},

/* ---- Economics batch 2 (Ch.7, 8, 10, 12) ---- */
{subj:E,type:'numeric',concept:'Consumer and producer surplus',ref:'Acemoglu Ch.7',answer:1250,
 question:'Demand is Qd = 100 − P and supply is Qs = P in a perfectly competitive market. What is the producer surplus at equilibrium?',
 explain:'100 − P = P → P = 50, Q = 50. PS = ½ × 50 × (50 − 0) = 1,250.'},
{subj:E,type:'numeric',concept:'Consumer and producer surplus',ref:'Acemoglu Ch.7',answer:2500,
 question:'Same market (Qd = 100 − P, Qs = P). What is the total surplus (consumer + producer) at the competitive equilibrium?',
 explain:'CS = ½ × 50 × (100 − 50) = 1,250 and PS = 1,250. Total surplus = 2,500, the maximum possible.'},
{subj:E,type:'numeric',unit:'$',concept:'Supply-demand equilibrium',ref:'Acemoglu Ch.7',answer:30,
 question:'Market demand is Qd = 200 − 2P and supply is Qs = 50 + 3P. What is the equilibrium price?',
 explain:'200 − 2P = 50 + 3P → 150 = 5P → P = 30 (and Q = 140).'},
{subj:E,type:'choice',concept:'Role of prices',ref:'Acemoglu Ch.7',answer:1,
 question:'What is a main function of the equilibrium price in a perfectly competitive market?',
 options:['To maximize government tax revenue','To allocate goods efficiently to the buyers and sellers who value/cost them most','To guarantee permanent positive economic profits','To remove the need for property rights'],
 explain:'The price coordinates buyers and sellers so that trade happens where it creates the most surplus.'},
{subj:E,type:'choice',concept:'Comparative advantage',ref:'Acemoglu Ch.8',answer:1,
 question:'In one hour Ann can make 6 pizzas or 3 cakes; Ben can make 2 pizzas or 2 cakes. Who has the comparative advantage in cakes?',
 options:['Ann, because she makes more cakes per hour','Ben, because his opportunity cost of a cake (1 pizza) is lower than Ann\'s (2 pizzas)','Ann, because she is better at making both goods','Neither: trade cannot benefit them'],
 explain:'Comparative advantage is about opportunity cost, not absolute productivity. Ann has an absolute advantage in both goods, but Ben gives up less to make a cake, so Ann should specialize in pizzas and Ben in cakes.'},
{subj:E,type:'numeric',unit:'units',concept:'Gains from trade (imports)',ref:'Acemoglu Ch.8',answer:40,
 question:'In a closed economy, demand is Qd = 100 − P and supply is Qs = P. The country opens to trade at a world price of 30. How many units are imported?',
 explain:'At P = 30: Qd = 70 and domestic Qs = 30. Imports = 70 − 30 = 40 (the closed-economy price was 50).'},
{subj:E,type:'numeric',unit:'units',concept:'Tariffs',ref:'Acemoglu Ch.8',answer:20,
 question:'Same market (Qd = 100 − P, Qs = P, world price 30). The government imposes a tariff of 10 per unit. How many units are imported now?',
 explain:'Domestic price = 30 + 10 = 40. Qd = 60 and Qs = 40, so imports = 20 (down from 40).'},
{subj:E,type:'numeric',unit:'$',concept:'Tariffs',ref:'Acemoglu Ch.8',answer:100,
 question:'Same market, world price 30, tariff of 10 (domestic price 40, imports fall from 40 to 20). What is the deadweight loss of the tariff?',
 explain:'DWL = ½ × 10 × (40 − 30) [overproduction by domestic firms] + ½ × 10 × (70 − 60) [lost consumption] = 50 + 50 = 100. Tariff revenue (10 × 20 = 200) is a transfer, not a loss.'},
{subj:E,type:'choice',concept:'Winners and losers from trade',ref:'Acemoglu Ch.8',answer:1,
 question:'A country opens to trade and becomes an exporter of a good. Which group gains surplus?',
 options:['Domestic consumers','Domestic producers','Foreign producers only','Tariff collectors'],
 explain:'The domestic price rises to the world price: producer surplus rises, consumer surplus falls, and the net effect is positive.'},
{subj:E,type:'numeric',concept:'Taxes: quantity effect',ref:'Acemoglu Ch.10',answer:45,
 question:'Demand is Qd = 100 − P and supply is Qs = P. A $10 excise tax is collected from sellers. What is the new equilibrium quantity?',
 explain:'Buyers pay P = 100 − Q; sellers receive P − 10 = Q. So 100 − Q = Q + 10 → Q = 45.'},
{subj:E,type:'numeric',unit:'$',concept:'Taxes: revenue',ref:'Acemoglu Ch.10',answer:1200,
 question:'Demand is Qd = 120 − P and supply is Qs = 20 + P. A tax of $20 per unit is levied. What is the government\'s tax revenue?',
 explain:'Buyers pay 120 − Q, sellers receive Q − 20; the wedge is 140 − 2Q = 20 → Q = 60. Revenue = 20 × 60 = 1,200.'},
{subj:E,type:'numeric',unit:'$',concept:'Taxes: deadweight loss',ref:'Acemoglu Ch.10',answer:100,
 question:'Demand is Qd = 100 − P and supply is Qs = P. A $20 tax cuts the quantity traded from 50 to 40. What is the deadweight loss?',
 explain:'DWL = ½ × tax × lost quantity = ½ × 20 × (50 − 40) = 100.'},
{subj:E,type:'choice',concept:'Taxes: price wedge',ref:'Acemoglu Ch.10',answer:1,
 question:'What does an excise tax create?',
 options:['A permanent increase in total surplus','A wedge between the price buyers pay and the price sellers receive, causing deadweight loss','The elimination of all consumer surplus','A Pareto improvement'],
 explain:'The wedge reduces the quantity traded below the efficient level, so some mutually beneficial trades no longer happen.'},
{subj:E,type:'numeric',concept:'Monopoly: MR = MC',ref:'Acemoglu Ch.12',answer:40,
 question:'A monopolist faces inverse demand P = 100 − Q and has total cost TC = 20Q. What is its profit-maximizing quantity?',
 explain:'MR = 100 − 2Q and MC = 20. Setting MR = MC gives Q = 40 (and P = 60).'},
{subj:E,type:'numeric',unit:'$',concept:'Monopoly: pricing',ref:'Acemoglu Ch.12',answer:60,
 question:'A monopolist with zero marginal cost faces inverse demand P = 120 − 2Q. What price does it charge?',
 explain:'MR = 120 − 4Q = 0 → Q = 30. The price comes from the demand curve: P = 120 − 2 × 30 = 60.'},
{subj:E,type:'choice',concept:'Monopoly: pricing rule',ref:'Acemoglu Ch.12',answer:1,
 question:'How does a monopolist\'s pricing rule differ from a perfectly competitive firm\'s?',
 options:['Monopolist sets P = MR = MC; competitive firms set P > MR.','Monopolist is a price-maker with P > MR = MC; competitive firms are price-takers with P = MR = MC.','Monopolist ignores marginal cost.','Competitive firms price on the elastic part of market demand.'],
 explain:'Both produce where MR = MC, but the monopolist\'s downward-sloping demand makes P > MR, while the competitive firm takes the price as given.'},

{subj:A,type:'multientry',concept:'Adjusting entries',ref:'Weygandt Ch.3',

function resetAll(){ if(confirm('Reset all progress?')){ store.set({m:{},c:{}}); home(); } }

function start(id){
  S={case:CASES.find(c=>c.id===id),i:0,score:0,tries:0,bal:{},done:false,missed:[],val:null};
  step();
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isWeak(q){ const m=store.get().m[q.concept]; return !!m&&m.r/(m.r+m.w)<0.7; }
function toStep(q){
  const b={story:q.question,concept:q.concept,ref:q.ref,explain:q.explain};
  if(q.type==='numeric') return {...b,type:'numeric',answer:q.answer,unit:q.unit||'',tol:q.tol??(Number.isInteger(q.answer)?0.5:0.02)};
  if(q.type==='choice'){ const o=shuffle(q.options.map((t,i)=>({t,c:i===q.answer}))); return {...b,type:'choice',options:o.map(x=>x.t),answer:o.findIndex(x=>x.c)}; }
  return {...b,type:'multientry',lines:q.lines};
}
function drill(si,n){
  let pool=si<0?QBANK.filter(isWeak):QBANK.filter(q=>q.subj===SUBJ[si]);
  pool=shuffle(pool); if(n) pool=pool.slice(0,n); if(!pool.length) return;
  S={case:{id:'drill-'+si,si,n,title:si<0?'Drill: weak spots':'Drill: '+SUBJ[si],steps:pool.map(toStep)},i:0,score:0,tries:0,bal:{},done:false,missed:[],val:null};
  step();
}
const norm=s=>s.toLowerCase().replace(/[—–-]/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function rowHtml(){ return '<tr><td><input type="text" list="accl" style="width:100%"></td><td><input type="number" step="any" style="width:100px"></td><td><input type="number" step="any" style="width:100px"></td></tr>'; }
function addRow(){ $('#rows').insertAdjacentHTML('beforeend',rowHtml()); }
function accNames(){ return [...new Set([...Object.keys(ACC),...Object.keys(WA),...QBANK.flatMap(q=>(q.lines||[]).map(l=>l.a))])].sort(); }

function step(){
  W(false);
  const c=S.case, st=c.steps[S.i];
  S.done=false; S.tries=0; S.val=st.type==='slider'?st.init:null;
  let h=`<div class="row"><button class="sec" onclick="home()">← Cases</button><span class="mu">${c.title} · step ${S.i+1}/${c.steps.length} · points ${f(S.score)}</span></div>`;
  h+=`<div class="card"><div style="margin-bottom:8px"><span class="tag">${st.concept}</span></div><div>${st.story}</div>`;
  if(st.type==='entry') h+=`<div id="eq">${eqPanel()}</div>`;
  if(st.showTB) h+=tbTable()+eqPanel();
  if(st.model) h+=`<div id="chart">${chart(st)}</div>`;
  if(st.type==='slider') h+=`<div id="live" class="live"></div><input type="range" id="sl" min="${st.min}" max="${st.max}" step="${st.step}" value="${st.init}" oninput="onSlide(this.value)"><div class="mu" id="slv"></div>`;
  if(st.type==='numeric') h+=`<p><input type="number" id="num" step="any" placeholder="Your answer" onkeydown="if(event.key==='Enter')check()"> ${st.unit||''}</p>`;
  if(st.type==='choice') h+=st.options.map((o,i)=>`<label class="opt"><input type="radio" name="ch" value="${i}"> ${o}</label>`).join('');
  if(st.type==='entry') h+=`<div class="row" style="justify-content:flex-start;margin-top:10px"><label>Debit <select id="dr">${accOpts()}</select></label><label>Credit <select id="cr">${accOpts()}</select></label><label>Amount € <input type="number" id="amt" style="width:110px"></label></div>`;
  if(st.type==='multientry'){ const nr=Math.min(10,Math.max(4,st.lines.length+1));
    h+=`<datalist id="accl">${accNames().map(a=>`<option value="${a}">`).join('')}</datalist><table style="margin-top:10px"><thead><tr><th>Account (pick from the list)</th><th class="n">Debit</th><th class="n">Credit</th></tr></thead><tbody id="rows">${Array.from({length:nr},rowHtml).join('')}</tbody></table><p><button class="sec" onclick="addRow()">+ line</button></p>`; }
  h+=`<div id="fb"></div><p><button id="go" onclick="check()">Check</button> <button id="nx" class="sec" style="display:none" onclick="next()">Next →</button></p></div>`;
  $('#app').innerHTML=h;
  if(st.type==='slider') onSlide(st.init);
}

function accOpts(){ return `<option value="">—</option>`+Object.keys(ACC).sort().map(a=>`<option>${a}</option>`).join(''); }

function onSlide(v){
  const st=S.case.steps[S.i]; v=+v; S.val=v; const m=st.model;
  let cells;
  if(m.kind==='market'){
    const qd=Math.max(0,m.a-m.b*v), qs=Math.max(0,m.c+m.d*v), q=Math.min(qd,qs);
    const gap=qd-qs;
    cells=[['Price',`€${v}`],['Qd',f(qd)],['Qs',f(qs)],[gap>0?'Shortage':gap<0?'Surplus':'Market clears',f(Math.abs(gap))],['Revenue',`€${f(v*q)}`]];
  } else {
    const p=Math.max(0,m.a-m.b*v), tr=p*v, tc=m.mc*v;
    cells=[['Quantity',f(v)],['Price',`€${f(p)}`],['MR',f(m.a-2*m.b*v)],['MC',f(m.mc)],['Profit',`€${f(tr-tc)}`]];
  }
  $('#live').innerHTML=cells.map(([a,b])=>`<div><span class="mu">${a}</span><br><b>${b}</b></div>`).join('');
  $('#slv').textContent=(m.kind==='market'?'Chosen price: €':'Chosen quantity: ')+v;
  $('#chart').innerHTML=chart(st,v);
}

function chart(st,v){
  const m=st.model,W=440,H=240,L=42,B=26,T=10,R=10;
  let qmax,pmax,ls;
  if(m.kind==='market'){ qmax=m.a; pmax=m.a/m.b;
    ls=[['Demand','#2563eb',[[0,m.a/m.b],[qmax,0]]],['Supply','#dc2626',[[0,-m.c/m.d],[qmax,(qmax-m.c)/m.d]]]];
  } else { qmax=m.a/m.b; pmax=m.a;
    ls=[['Demand','#2563eb',[[0,m.a],[qmax,0]]],['MR','#9333ea',[[0,m.a],[qmax/2,0]]],['MC','#dc2626',[[0,m.mc],[qmax,m.mc]]]];
  }
  const sx=q=>L+q/qmax*(W-L-R), sy=p=>H-B-p/pmax*(H-B-T);
  const id='cp'+Math.floor(Math.random()*1e6);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><defs><clipPath id="${id}"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-B-T}"/></clipPath></defs>`;
  g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#888"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#888"/>`;
  g+=`<text x="${W-R-10}" y="${H-8}">Q</text><text x="6" y="${T+8}">P</text>`;
  ls.forEach(([n,c,[a,b]],k)=>{ g+=`<line clip-path="url(#${id})" x1="${sx(a[0])}" y1="${sy(a[1])}" x2="${sx(b[0])}" y2="${sy(b[1])}" stroke="${c}" stroke-width="2.2"/><text x="${W-R-60}" y="${T+14+k*13}" style="fill:${c}">${n}</text>`; });
  if(v!==undefined){
    if(m.kind==='market') g+=`<line clip-path="url(#${id})" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="2"/>`;
    else g+=`<line clip-path="url(#${id})" y1="${T}" y2="${H-B}" x1="${sx(v)}" x2="${sx(v)}" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="2"/>`;
  }
  return g+'</svg>';
}

function eqVals(){
  let A=0,Lb=0,E=0;
  for(const [a,t] of Object.entries(ACC)){ const nd=S.bal[a]||0;
    if(t==='asset') A+=nd; else if(t==='liability') Lb-=nd; else E-=nd; }
  return {A,Lb,E};
}
function eqPanel(){ const {A,Lb,E}=eqVals(); return `<div class="eq"><span>Assets <b>€${f(A)}</b></span><span>=</span><span>Liabilities <b>€${f(Lb)}</b></span><span>+</span><span>Equity (incl. net income) <b>€${f(E)}</b></span></div>`; }
function tbTable(){
  const rows=Object.keys(ACC).filter(a=>S.bal[a]).map(a=>{ const n=S.bal[a]; return `<tr><td>${a} <span class="mu">(${ACC[a]})</span></td><td class="n">${n>0?f(n):''}</td><td class="n">${n<0?f(-n):''}</td></tr>`; }).join('');
  return `<table style="margin-top:10px"><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>${rows}</table>`;
}
function applyEntry(st){ S.bal[st.dr]=(S.bal[st.dr]||0)+st.amt; S.bal[st.cr]=(S.bal[st.cr]||0)-st.amt; }

/* ============ LÓGICA DE RESPUESTA ============ */
function check(){
  if(S.done) return;
  const st=S.case.steps[S.i]; let ok=false, extra='', valid=true;
  if(st.type==='slider'){ ok=Math.abs(S.val-st.answer)<=st.tol;
    if(st.model.kind==='market'){ const m=st.model, qd=m.a-m.b*S.val, qs=m.c+m.d*S.val;
      extra=qd===qs?'':` At your price: ${qd>qs?'shortage':'surplus'} of ${f(Math.abs(qd-qs))} units.`; } }
  else if(st.type==='numeric'){ const el=$('#num'); if(el.value===''){valid=false;} else ok=Math.abs(+el.value-st.answer)<=st.tol; }
  else if(st.type==='choice'){ const r=document.querySelector('input[name=ch]:checked'); if(!r) valid=false; else ok=+r.value===st.answer; }
  else if(st.type==='multientry'){
    const got={}, exp={};
    document.querySelectorAll('#rows tr').forEach(tr=>{ const [a,d,c]=tr.querySelectorAll('input'), k=norm(a.value); if(!k) return;
      if(+d.value>0) got[k+'|D']=(got[k+'|D']||0)+ +d.value; if(+c.value>0) got[k+'|C']=(got[k+'|C']||0)+ +c.value; });
    st.lines.forEach(l=>{ const k=norm(l.a)+'|'+l.s; exp[k]=(exp[k]||0)+l.v; });
    if(!Object.keys(got).length) valid=false;
    else ok=[...new Set([...Object.keys(got),...Object.keys(exp)])].every(k=>Math.abs((got[k]||0)-(exp[k]||0))<0.5);
  }
  else if(st.type==='entry'){ const dr=$('#dr').value, cr=$('#cr').value, am=+$('#amt').value;
    if(!dr||!cr||!am) valid=false; else {
      ok=dr===st.dr&&cr===st.cr&&am===st.amt;
      if(!ok&&S.tries===0){ S.tries=1;
        $('#fb').innerHTML=`<div class="fb ko">Incorrect. Hint: the debit is a(n) <b>${ACC[st.dr]}</b> account; the credit is a(n) <b>${ACC[st.cr]}</b> account. Also check the amount and try again.</div>`; return; } } }
  if(!valid){ $('#fb').innerHTML=`<div class="fb ko">Complete your answer first.</div>`; return; }
  finish(st,ok,extra);
}

function finish(st,ok,extra){
  S.done=true;
  const pts=ok?(st.type==='entry'&&S.tries===1?0.5:1):0; S.score+=pts;
  if(!ok) S.missed.push(st);
  const d=store.get(); const m=d.m[st.concept]||(d.m[st.concept]={r:0,w:0,ref:st.ref});
  ok?m.r++:m.w++; store.set(d);
  if(st.type==='entry') applyEntry(st);
  let ans='';
  if(st.type==='entry') ans=`Correct entry: Debit <b>${st.dr}</b> / Credit <b>${st.cr}</b> · €${f(st.amt)}. `;
  else if(st.type==='numeric') ans=`Answer: <b>${f(st.answer)} ${st.unit||''}</b>. `;
  else if(st.type==='multientry') ans='Correct entries: '+st.lines.map(l=>`${l.s==='D'?'Dr':'Cr'} <b>${l.a}</b> ${f(l.v)}`).join(' · ')+'. ';
  else if(st.type==='slider') ans=`Answer: <b>${st.model.kind==='market'?'price ':'quantity '}${st.answer}</b>. `;
  else ans=`Answer: <b>${st.options[st.answer]}</b>. `;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?'Correct':'Not quite'}${ok&&pts<1?' (with hint, ½ point)':''}.</b> ${ans}${extra}<br>${st.explain}<br><span class="mu">Review: ${st.ref}</span></div>`;
  if(st.type==='entry'){ $('#eq').innerHTML=eqPanel(); }
  $('#go').style.display='none'; $('#nx').style.display='';
  document.querySelectorAll('input,select').forEach(e=>e.disabled=true);
}

function next(){
  S.i++;
  if(S.i<S.case.steps.length) return step();
  const c=S.case, max=c.steps.length, d=store.get(), prev=d.c[c.id];
  if(!prev||S.score>prev.best) d.c[c.id]={best:S.score,max};
  store.set(d);
  const miss=[...new Map(S.missed.map(s=>[s.concept,s])).values()];
  $('#app').innerHTML=`<h1>${c.title}: ${f(S.score)}/${max}</h1><div class="card">${miss.length?`<b>To review:</b><ul>${miss.map(s=>`<li>${s.concept} — <span class="mu">${s.ref}</span></li>`).join('')}</ul>`:'No misses. Move on to the next case.'}</div><p><button onclick="${c.si!==undefined?`drill(${c.si},${c.n})`:`start('${c.id}')`}">Replay</button> <button class="sec" onclick="home()">Back</button></p>`;
}

let MUTE=false, AC=null;
function sfx(k){ if(MUTE) return; try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let at=AC.currentTime;
  const seq={stamp:[[160,.09,'square'],[90,.12,'square']],ok:[[523,.08,'square'],[784,.14,'square']],bad:[[196,.14,'sawtooth'],[130,.22,'sawtooth']],bell:[[880,.1,'triangle'],[1175,.2,'triangle']]}[k];
  seq.forEach(([fr,du,ty])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=ty; o.frequency.value=fr; g.gain.setValueAtTime(.07,at); g.gain.exponentialRampToValueAtTime(.001,at+du); o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at+du); at+=du*0.9; });
}catch(e){} }
function hash(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=hash(seed); return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function paint(cv,seed){

  const out=[]; shuffle(cand).forEach(v=>{ if(out.length<k&&Math.abs(v-a)>tol&&!out.some(o=>Math.abs(o-v)<=tol)) out.push(v); });

  ans:t=>`<table class="mini">${t.accs.map(a=>`<tr><td>${a}</td><td>${CATS[WA[a]]}</td></tr>`).join('')}</table>`},
 is:{ui:t=>tbView(t.rows)+inp('w1','Total revenues')+inp('w2','Total expenses')+inp('w3','Net income'),
  grade:t=>{ const a=[1,2,3].map(i=>nv('w'+i)); if(a.includes(null)) return null; const s=t.ans; return {ok:Math.abs(a[0]-s.rev)<0.5&&Math.abs(a[1]-s.exp)<0.5&&Math.abs(a[2]-s.ni)<0.5}; },
  ans:t=>`Revenues <b>€${f(t.ans.rev)}</b> · Expenses <b>€${f(t.ans.exp)}</b> · Net income <b>€${f(t.ans.ni)}</b>`},
 bs:{ui:t=>tbView(t.rows)+inp('w1','Net income')+inp('w2','Ending retained earnings')+inp('w3','Total assets (net)')+inp('w4','Total liabilities')+inp('w5','Total equity'),
  grade:t=>{ const a=[1,2,3,4,5].map(i=>nv('w'+i)); if(a.includes(null)) return null; const s=t.ans; return {ok:[s.ni,s.end,s.ta,s.tl,s.te].every((x,i)=>Math.abs(a[i]-x)<0.5)}; },
  ans:t=>`Net income <b>€${f(t.ans.ni)}</b> · Ending RE <b>€${f(t.ans.end)}</b> · Assets <b>€${f(t.ans.ta)}</b> · Liabilities <b>€${f(t.ans.tl)}</b> · Equity <b>€${f(t.ans.te)}</b> (A = L + E)`}
};
function workStart(key,di){
  W(true);
  const t=TRACKS.find(x=>x.key===key), day=t.days[di];
  D={t,di,day,work:true,q:day.gen(),i:0,cash:0,warn:2,ok:0,miss:[],times:[],t0:0,showNew:true};
  $('#app').innerHTML=`<div class="row"><button class="sec" onclick="home()">← Exit</button><span class="mu">${t.name}</span></div>
   <div class="paper" style="margin:12px 0"><canvas class="pt boss" data-seed="boss-${key}-${di}"></canvas><h1>Day ${di+1}: ${day.name}</h1><p><i>Memo from your manager:</i> ${day.memo}</p>
   <p><b>${D.q.length} jobs today.</b> +€50 per correct job. The first 2 mistakes are free warnings; after that, −€75 per citation. You need 60% to move on.</p></div>
   ${rulesHtml()}<p><button onclick="D.showNew=false;workCase()">Open the office</button></p>`;
  drawPortraits(); sfx('bell');
}
function workCase(){
  W(true);
  if(D.i>=D.q.length) return deskEnd();
  if(D.q[D.i].q) return deskCase();
  const t=D.q[D.i]; D.t0=Date.now(); D.dec=false;
  $('#app').innerHTML=`<div class="hud"><span>DAY ${D.di+1} · ${D.day.name}</span><span>JOB ${D.i+1}/${D.q.length}</span><span id="cash">€${D.cash}</span><span id="warn">WARN ${'■'.repeat(D.warn)+'□'.repeat(2-D.warn)}</span><span>⏱ <b id="clk">0:00</b></span><button class="sec" style="padding:2px 8px;font-size:9px" onclick="MUTE=!MUTE;this.textContent=MUTE?'♪ off':'♪ on'">${MUTE?'♪ off':'♪ on'}</button></div>
  <div class="booth"><canvas class="pt" id="pt" data-seed="${D.t.key}${D.di}-${D.i}-${t.client}"></canvas><div class="counter"><div class="plate">${t.client.toUpperCase()}</div></div></div>
  <div class="desktop"><div class="grid2"><div class="main"><div class="paper"><div class="mu">${t.client.toUpperCase()} · ${t.role.toUpperCase()}</div><p class="scene">“${t.text}”</p>${WT[t.kind].ui(t)}</div>
  <p id="wact"><button class="appr" onclick="workSubmit()">✔ FILE IT</button></p><div id="verdict"></div></div><div class="side">${rulesHtml()}${padHtml()}</div></div></div>`;
  drawPortraits(); sfx('bell'); initPad(); FIT(); padSize(); clearInterval(CK); CK=setInterval(tick,1000); tick();
}
function workSubmit(){
  if(D.dec) return; const t=D.q[D.i], r=WT[t.kind].grade(t);
  if(!r){ $('#verdict').innerHTML='<div class="card"><b>Complete the job first.</b></div>'; return; }
  D.dec=true; clearInterval(CK); D.times.push((Date.now()-D.t0)/1000); savePad(r.ok,t.concept); let label;
  if(r.ok){ D.cash+=50; D.ok++; label='CORRECT +€50'; }
  else { D.miss.push(t); if(D.warn>0){ D.warn--; label='WARNING (free)'; } else { D.cash-=75; label='CITATION −€75'; } }
  $('#cash').textContent='€'+D.cash; $('#warn').textContent='WARN '+'■'.repeat(D.warn)+'□'.repeat(2-D.warn);
  sfx('stamp'); setTimeout(()=>sfx(r.ok?'ok':'bad'),200); const pt=$('#pt'); if(pt) pt.classList.add('leave');
  document.querySelectorAll('#wact button').forEach(b=>b.disabled=true); if(document.getElementById('app').classList.contains('fit')) $('#wact').style.display='none';
  const react=r.ok?'The books are clean. Thank you.':'That will not match our records. We need to redo it.';
  $('#verdict').innerHTML=`<div class="card"><span class="stamp ${r.ok?'ok':'ko'}">${label}</span><p class="quote">“${react}” <span class="mu">— ${t.client}</span></p>${r.ok?'':`<p><b>Correct:</b></p>${WT[t.kind].ans(t)}`}<p class="mu">${t.why} · ${t.ref}</p><button onclick="D.i++;workCase()">Next job →</button></div>`;
  $('#verdict').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ===== FREE MODE: pick chapters, serve clients ===== */
const WKT={je:['Ch.2 · Journal entries (bookkeeping)',()=>mkJE([pick([...JE1,...JE2])])[0]],
  tb:['Ch.2 · Trial balance',()=>mkTB(pick(['tb1','tb2']))],
  adj:['Ch.3 · Adjusting entries (bookkeeping)',()=>mkJE([pick(JE3)])[0]],
  fs:['Ch.4 · Financial statements',()=>pick([mkCLS,mkIS,mkBS])()]};
const WKR={je:[['book',1],['book',2]],tb:[['book',3]],adj:[['fs',1]],fs:[['fs',2],['fs',3],['fs',4]]};
function ruleKeys(sub){ return Object.keys(RULES[sub]).map(Number).sort((a,b)=>a-b); }
function freeOpts(){
  const ec=ruleKeys('econ'), ac=ruleKeys('acc'), cnt=(subj,sub,k)=>{ const ks=ruleKeys(sub); return QBANK.filter(q=>q.subj===subj&&ks.filter(x=>x<=chOf(q)).pop()===k).length; };
  return {econ:ec.map(k=>({v:'econ:'+k,t:RULES.econ[k][0],n:cnt(E,'econ',k)})),
    acc:[...ac.map(k=>({v:'acc:'+k,t:RULES.acc[k][0],n:cnt(A,'acc',k)})),...Object.keys(WKT).map(k=>({v:'wk:'+k,t:WKT[k][0],n:'∞'}))]};
}
function freeSetup(){
  W(true);
  const d=store.get(), last=d.free||{sel:[],n:10}, o=freeOpts();
  const col=(name,key)=>`<div class="card"><h3>${name}</h3><div style="margin-bottom:6px"><button class="sec" onclick="freeAll('${key}',true)">All</button> <button class="sec" onclick="freeAll('${key}',false)">None</button></div>${o[key].map(x=>`<label class="opt"><input type="checkbox" class="fc ${key}" value="${x.v}" ${last.sel.includes(x.v)?'checked':''}> ${x.t} <span class="mu">(${x.n})</span></label>`).join('')}</div>`;
  $('#app').innerHTML=`<div class="row"><button class="sec" onclick="home()">← Exit</button><span class="mu">Free mode</span></div><h2>Free mode</h2><p class="mu">Pick the chapters you want to practise. Clients come in random order from those chapters only. The number in brackets is how many hand-made cases the chapter has; bookkeeping topics generate new cases every time.</p>
   <div class="grid2">${col('Economics & Business','econ')}${col('Accounting & Financial Reporting','acc')}</div>
   <p>Clients: <select id="fn">${[8,12,20,30].map(n=>`<option ${n===last.n?'selected':''}>${n}</option>`).join('')}</select> <button onclick="freeStart()">Open the office</button> <span id="fe" class="mu"></span></p>`;
}
function freeAll(k,on){ document.querySelectorAll('.fc.'+k).forEach(c=>c.checked=on); }
function freeStart(sel,n){
  if(!sel){ sel=[...document.querySelectorAll('.fc:checked')].map(c=>c.value); n=+$('#fn').value; }
  if(!sel.length){ $('#fe').textContent='Select at least one chapter.'; return; }
  const d=store.get(); d.free={sel,n}; store.set(d);
  const pool=QBANK.filter(q=>sel.some(s=>{ const [sub,k]=s.split(':'); if(sub==='wk') return false; const ks=ruleKeys(sub); return q.subj===(sub==='econ'?E:A)&&ks.filter(x=>x<=chOf(q)).pop()===+k; }));
  const wk=sel.filter(s=>s.startsWith('wk:')).map(s=>s.slice(3));
  const src=[...Array(pool.length?Math.min(pool.length,4):0).fill('q'),...wk];
  let bag=[],last=null; const nextQ=()=>{ if(!bag.length){ let t=0; do{ bag=shuffle(pool.slice()); }while(bag.length>1&&bag[bag.length-1]===last&&++t<9); } return last=bag.pop(); };
  const q=[]; for(let i=0;i<n;i++){ const s=pick(src); q.push(s==='q'?mkCase(nextQ()):WKT[s][1]()); }
  const rules=[], seen=new Set(); sel.forEach(s=>{ const [sub,k]=s.split(':'); const refs=sub==='wk'?WKR[k].map(([a,b])=>RULES[a][b]):[RULES[sub][k]]; refs.forEach(r=>{ if(!seen.has(r[0])){ seen.add(r[0]); rules.push(r); } }); });
  D={t:{key:'free',name:'Free mode',days:[]},di:0,day:{name:'Free session',ch:[]},free:true,sel,n,rules,q,i:0,cash:0,warn:2,ok:0,miss:[],times:[],t0:0,showNew:false};
  deskCase();
}
function freeEnd(){
  W(true);
  const n=D.q.length, pct=D.ok/n, avg=D.times.reduce((a,b)=>a+b,0)/n, miss=[...new Map(D.miss.map(x=>[x.concept||x.q.concept,x.q||x])).values()];
  const mm=Math.floor(avg/60)+':'+String(Math.round(avg%60)).padStart(2,'0');
  $('#app').innerHTML=`<h1>Free session report</h1><div class="paper"><p>Correct: <b>${D.ok}/${n}</b> (${Math.round(pct*100)}%) · Earnings: <b>€${D.cash}</b> · Average time per case: <b>${mm}</b></p>
   ${miss.length?`<b>Review these:</b><ul>${miss.map(q=>`<li>${q.concept} — <span class="mu">${q.ref}</span></li>`).join('')}</ul>`:'<p>Clean session. No citations.</p>'}${padsHtml()}</div>
   <p><button onclick="freeStart(D.sel,D.n)">Same chapters again</button> <button class="sec" onclick="freeSetup()">Change chapters</button> <button class="sec" onclick="home()">Back to menu</button></p>`;
}

/* ===== SCRATCH PAD (Apple Pencil / mouse / finger) ===== */
let PAD=null;
const INKS=['#1d1a16','#a8352b','#1f4e9c'];
function padHtml(){
  return `<div class="padwrap" id="padwrap"><div class="padbar"><button class="sec" onclick="padTool('pen')">✎ Pen</button><button class="sec" onclick="padTool('er')">⌫ Eraser</button>${INKS.map(c=>`<button class="sec sw" style="background:${c}" onclick="padInk('${c}')" aria-label="ink"></button>`).join('')}<button class="sec" onclick="padUndo()">↶ Undo</button><button class="sec" onclick="padClear()">Clear</button><button class="sec" onclick="padBig()" id="padbig">⤢ Big board</button></div><canvas id="pad" class="pad"></canvas></div>`;
}
function initPad(){
  const cv=document.getElementById('pad'); PAD=null; if(!cv) return;
  const g=cv.getContext&&cv.getContext('2d'); if(!g||!g.beginPath) return;
  PAD={cv,g,strokes:[],cur:null,tool:'pen',ink:INKS[0],penSeen:false,w:1,h:1,dpr:1};
  padSize();
  const P=PAD, pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/(r.width||1),(e.clientY-r.top)/(r.height||1),e.pressure>0?e.pressure:0.5]; };
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen') P.penSeen=true;
    if(e.pointerType==='touch'&&P.penSeen) return;
    e.preventDefault(); if(cv.setPointerCapture) try{cv.setPointerCapture(e.pointerId);}catch(_){}
    P.cur={er:P.tool==='er'||!!(e.buttons&32),c:P.ink,pts:[pos(e)]}; P.strokes.push(P.cur); padRedraw();
  });
  cv.addEventListener('pointermove',e=>{
    if(!P.cur) return; if(e.pointerType==='touch'&&P.penSeen) return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; (evs.length?evs:[e]).forEach(x=>P.cur.pts.push(pos(x))); padRedraw();
  });
  const end=()=>{ P.cur=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); cv.addEventListener('pointerleave',end);
  cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  window.addEventListener('resize',padSize);
}
function padSize(){
  if(!PAD||!PAD.cv.isConnected) return;
  const r=PAD.cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  PAD.w=r.width||1; PAD.h=r.height||1; PAD.dpr=d; PAD.cv.width=Math.round(PAD.w*d); PAD.cv.height=Math.round(PAD.h*d); padRedraw();
}
function padRedraw(){
  const P=PAD; if(!P) return; const g=P.g; g.setTransform(P.dpr,0,0,P.dpr,0,0); g.clearRect(0,0,P.w,P.h); g.lineCap='round'; g.lineJoin='round';
  P.strokes.forEach(s=>{
    g.globalCompositeOperation=s.er?'destination-out':'source-over'; g.strokeStyle=s.er?'#000':s.c;
    const pts=s.pts; if(pts.length===1){ g.fillStyle=g.strokeStyle; g.beginPath(); g.arc(pts[0][0]*P.w,pts[0][1]*P.h,s.er?9:1.6,0,6.3); g.fill(); return; }
    for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i]; g.lineWidth=s.er?18:1.2+2.8*((a[2]+b[2])/2); g.beginPath(); g.moveTo(a[0]*P.w,a[1]*P.h); g.lineTo(b[0]*P.w,b[1]*P.h); g.stroke(); }
  });
  g.globalCompositeOperation='source-over';
}
function padTool(t){ if(PAD) PAD.tool=t; }
function padInk(c){ if(PAD){ PAD.ink=c; PAD.tool='pen'; } }
function padUndo(){ if(PAD){ PAD.strokes.pop(); padRedraw(); } }
function padClear(){ if(PAD){ PAD.strokes=[]; padRedraw(); } }
function padBig(){
  const w=document.getElementById('padwrap'); if(!w||!PAD) return; w.classList.toggle('big');
  document.getElementById('padbig').textContent=w.classList.contains('big')?'✔ Done':'⤢ Big board';
  requestAnimationFrame(padSize); setTimeout(padSize,60);
}
function savePad(ok,title){
  if(!PAD||!PAD.strokes.length) return;
  try{ const t=document.createElement('canvas'); t.width=320; t.height=Math.max(1,Math.round(320*PAD.cv.height/PAD.cv.width)); const x=t.getContext('2d');
    x.fillStyle='#fbf7ec'; x.fillRect(0,0,t.width,t.height); x.drawImage(PAD.cv,0,0,t.width,t.height);
    const img=t.toDataURL('image/png'); if(img) (D.pads=D.pads||[]).push({title,ok,img}); }catch(_){}
}
function padsHtml(){
  const m=(D.pads||[]).filter(p=>!p.ok); if(!m.length) return '';
  return `<p><b>Your scratch work on missed cases:</b></p><div class="thumbs">${m.map(p=>`<figure><img src="${p.img}" alt=""><figcaption class="mu">${p.title}</figcaption></figure>`).join('')}</div>`;
}

home();
</script>
